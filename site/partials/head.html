<link rel="alternate" hreflang="zh-Hans" href="{{ABS_HREF_ZH}}">
<link rel="alternate" hreflang="en" href="{{ABS_HREF_EN}}">
<link rel="alternate" hreflang="x-default" href="{{ABS_HREF_ZH}}">
<script>
/* First visit only: send readers whose browser is not set to Chinese to the
   English page. Using the language switch stores a choice, after which this
   never runs again — one automatic decision, ever. Inline and blocking so the
   redirect happens before anything paints. */
(function () {
  try {
    var store = window.localStorage;
    if (store && store.getItem("npex-lang")) return;
    if ("{{PAGE_LANG}}" !== "zh") return;
    var tags = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < tags.length; i++) if (/^zh/i.test(tags[i])) return;
    location.replace("{{HREF_EN}}");
  } catch (e) {}
})();
</script>
