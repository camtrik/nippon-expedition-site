<nav class="site-nav" aria-label="{{T_NAV_ARIA}}">
  <div class="site-nav__pill">
    <a href="{{HREF_HOME}}" class="site-nav__logo">{{T_SITE_NAME}}</a>
    <div class="site-nav__links">
      <a href="{{HREF_LOG}}" class="site-nav__link--log{{CLASS_LOG_ACTIVE}}">{{T_NAV_LOG}}</a>
      <a href="{{WORKSHOP_URL}}" target="_blank" rel="noopener">{{T_NAV_WORKSHOP}} ↗</a>
      <span class="lang-switch">
        <a href="{{HREF_ZH}}" class="lang-switch__item{{CLASS_ZH_ACTIVE}}" hreflang="zh-Hans" data-lang="zh">中</a>
        <a href="{{HREF_EN}}" class="lang-switch__item{{CLASS_EN_ACTIVE}}" hreflang="en" data-lang="en">EN</a>
      </span>
      <a href="https://github.com/camtrik/nippon-expedition-site" target="_blank" rel="noopener" aria-label="GitHub" class="site-nav__github">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </div>
  </div>
</nav>
<script>
(function () {
  var nav = document.querySelector('.site-nav');
  if (!nav) return;

  /* Remember the reader's language choice so the first-visit redirect in
     head.html stops firing. */
  nav.querySelectorAll('[data-lang]').forEach(function (link) {
    link.addEventListener('click', function () {
      try { window.localStorage.setItem('npex-lang', link.dataset.lang); } catch (e) {}
    });
  });

  /* Hide the pill on the way down, bring it back on the way up. */
  var prev = 0, threshold = 80;
  window.addEventListener('scroll', function () {
    var curr = window.pageYOffset;
    if (curr > threshold && curr > prev) { nav.classList.add('site-nav--hidden'); }
    else { nav.classList.remove('site-nav--hidden'); }
    prev = curr;
  }, { passive: true });

  /* Over the hero photograph the pill is dark; once it clears the photograph
     it takes the cream page's light treatment. */
  var hero = document.querySelector('.hero');
  if (hero && 'IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      nav.classList.toggle('site-nav--landed', !entries[0].isIntersecting);
    }, { rootMargin: '-72px 0px 0px 0px' }).observe(hero);
  }
})();
</script>
