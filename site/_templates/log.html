<!DOCTYPE html>
<html lang="{{LANG_HTML}}">
<head>
  <!-- include: head.html -->
  <title>{{T_PAGE_TITLE}}</title>
  <link rel="stylesheet" href="{{SITE_BASE_PATH}}/assets/css/log.css">
</head>
<body class="page page--log">
  <!-- include: header.html -->

  <main id="main">
    <section class="section section--no-pad-top section--no-pad-bottom">
      <div class="section__inner">
       <div class="log-column">
{{LOG_VIEW_INPUTS}}
        <header class="log-hero">
          <div class="eyebrow eyebrow--with-dot log-hero__eyebrow">CHANGELOG</div>
          <h1>{{T_LOG_HEADING}}</h1>
          <div class="log-hero__meta">
{{LOG_VIEWS}}
            <span class="stamp log-stamp">
              {{T_LATEST}} {{LATEST_STAMP}}
            </span>
          </div>
        </header>

        <div class="log-timeline">
{{RELEASES}}
        </div>
       </div>
      </div>
    </section>
  </main>

  <!-- include: footer.html -->
</body>
</html>
